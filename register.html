    <header>
        <div class="arriba">
            <a href="./login.html">Login</a>
            <a href="./register.html">Register</a>

        <div class="orden">
         <img src="./img/logo.png" alt="logo de pagina">
        
        <nav>

    <section class="section-register">
        <form action="./index.html"  method="GET">
            <div class="form-register">
                <h1>REGISTRATE</h1>
            </div>
    
            <div class="form-register">
                <label for="email">Email </label>
                <input id="email" type="email" name="email" value="">
            </div>

            <div class="form-register">
                <label for="contraseña">Contraseña </label>
                <input type="password" name="password" value="">
            </div>

            <div class="form-register">
                <label for="repeat">Repetir contraseña </label>
                <input id="repeat" type="password" name="repeat" value="">
            </div>

            <div class="form-register">
                <button type="submit">
                    Registrarme 
                </button>
            </div>

            <div class="checkbox-register">
                <input type="checkbox" name="TyC" value="Terminos y Condiciones">
                <label for="TyC">Acepto términos y condiciones</label>  
            </div>

            <p class="form-register"><a href="./login.html">Ya tengo una cuenta</a></p>
        
        
        </form>
    </section>

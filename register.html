<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Jost:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Bookly-Registro</title>
</head>

<body>
    <header>
        <nav>
            <ul class="arriba">
                <li><a href="./login.html">Login</a></li>
                <li><a href="./register.html">Register</a></li>
            </ul>
        </nav>
        <div class="orden">
            <a href="./index.html">
                <img src="./img/logo.png" alt="logo de pagina">
            </a>

            <form action="./search-results.html" method="get" class="buscador">
                <input type="text" placeholder="buscar" name="q">
                <button type="submit">buscar</button>
            </form>
        </div>

    </header>
    <main class="main-register">
        
        <section class="section-register">

            <form action="./login.html" method="GET">
                <div class="form-register">
                    <h1>REGISTRATE</h1>
                </div>

                <div class="form-register">
                    <label for="email">Email </label>
                    <input id="email" type="email" name="email" value="" placeholder="Email">
                </div>

                <div class="form-register">
                    <label for="password">Contraseña </label>
                    <input id="password" type="password" name="password" value="" placeholder="Contraseña">
                </div>

                <div class="form-register">
                    <label for="repeat">Repetir contraseña </label>
                    <input id="repeat" type="password" name="repeat" value="" placeholder="Repetir contraseña">
                </div>

                <div class="form-register">
                    <button type="submit">
                        Registrarme
                    </button>
                </div>

                <div class="checkbox-register">
                    <input  id="TYC" type="checkbox"  name="TyC">
                    <label for="TyC">Acepto términos y condiciones</label>
                </div>

                <p class="form-register"><a href="./login.html">Ya tengo una cuenta</a></p>


            </form>
        </section>
    </main>

    <footer >
        <div class="abajo">
        <img src="./img/logo.png" alt="">
        <h3>Tu librería digital preferida. Descubre historias increíbles a un clic de distancia. </h3>
        </div>

        <div class="medio">
        <h3>Desarrollado por:</h3>
        <ul>
            <li>Laila G. Rocco Zamorano</li>
            <li>M. Agustina Gonzalez Muller</li>
            <li>Sol Reinoso</li>
        </ul>
        </div>
    </footer>

</body>

</html>

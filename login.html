<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Bookly-Login</title>
</head>
<body>
    
    <header>
        <nav> 
            <ul> 
             <li><a href="./index.html">Home</a>|</li>
             <li><a href="./login.html">Login</a>|</li>
             <li><a href="./product.html">Product</a></li>
             <li><a href="./category.html">Category</a>|</li>
             <li><a href="./register.html">Register</a>|</li>
             <li><a href="./search-results.html">search-results</a>|</li>
            </ul>
        </nav>
    </header>

    <main class="main-form">

        <h1>BIENVENIDO</h1>

        <form class="form-login" action="./index.html" method="post">

            <div class="campo">
                <label for="email">Email</label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Email"
                >

                <span class="error">Obligatorio.</span>
            </div>


            <div class="campo">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="password"
                >

                <span class="error">Obligatorio.</span>
            </div>

            <div class="recordar">
                <input
                    type="checkbox"
                    name="recordar"
                    id="recordar"
                    value="si"
                >

                <label for="recordar">Recordarme</label>
            </div>

            <span class="error-login">
                La combinación ingresada de email y contraseña no es válida.
            </span>

            <button class="boton-form" type="submit">
                Ingresar
            </button>

        </form>

    </main>

    <footer>
        <p>Somos Laila G. Rocco Zamorano, M. Agustina González Müller y Sol Reinoso </p>
    </footer>
    
</body>
</html>

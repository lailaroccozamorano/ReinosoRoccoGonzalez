<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Jost:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Bookly-Login</title>
</head>
<body>
    
    <header>
        <nav>
            <ul class="arriba">
                <li class="menu-login"><a href="./login.html">Login</a></li>
                <li class="menu-registro"><a href="./register.html">Register</a></li>
                <li class="saludo-usuario"></li>
                <li class="menu-logout"><a href="#" class="logout">Logout</a> </li>
            </ul>
        </nav>
        <div class="orden">
            <a href="./index.html">
                <img src="./img/logo.png" alt="logo de pagina">
            </a>

            <form action="./search-results.html" method="get" class="buscador">
                <input type="text" placeholder="buscar" name="q" value="">
                <button type="submit">buscar</button>
            </form>
        </div>
    </header>

    <main class="main-login">
        
        <section class="section-login">

            <h1>BIENVENIDO</h1>

            <form class="formulariologin" action="./index.html" method="GET">

                <div class="form-login">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Email"
                        value=""
                    >

                    <span class="error error-email"></span>
                </div>


                <div class="form-login">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="password"
                        value=""
                    >

                    <span class="error error-password"></span>
                </div>

                <div class="checkbox-login">
                    <input
                        type="checkbox"
                        name="recordar"
                        id="recordar"
                        value="si"
                    >

                    <label for="recordar">Recordarme</label>
                </div>

                <button class="boton-form" type="submit">
                    Ingresar
                </button>

                <p class="form-login"><a href="./register.html">No tengo una cuenta</a></p>

            </form>

        </section>
    </main>

    <footer >
         <div class="abajo">
        <img src="./img/logo.png" alt="">
        <h3>Tu librería digital preferida. Descubre historias increíbles a un clic de distancia. </h3>
        </div>

        <div class="medio">
        <h3>Desarrollado por:</h3>
        <ul>
            <li>Laila G. Rocco Zamorano</li>
            <li>M. Agustina Gonzalez Muller</li>
            <li>Sol Reinoso</li>
        </ul>
        </div>
    </footer>
    
    <script src="./js/login.js"></script>
    <script src="./js/product.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/search-results.js"></script>
</body>
</html>
